name: Release - Production Build & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tên phiên bản Release (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Tiêu đề bản phát hành'
        required: false
        default: 'TicketsCenter Production Release'
      is_draft:
        description: 'Tạo dưới dạng Draft Release?'
        type: boolean
        default: false
      is_prerelease:
        description: 'Đánh dấu là bản Pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Build Production WAR
        run: |
          mvn -B clean package -DskipTests=false

      - name: Generate Checksums & Metadata
        run: |
          cd target
          sha256sum ticketscenter.war > ticketscenter.war.sha256
          echo "SHA256 Checksum:"
          cat ticketscenter.war.sha256

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=TicketsCenter Release $TAG" >> $GITHUB_OUTPUT
          else
            PROJECT_VER=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml || echo "1.0.0")
            CLEAN_VER="${PROJECT_VER%-SNAPSHOT}"
            if [[ "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAG="v${CLEAN_VER}-build.${{ github.run_number }}"
            else
              TAG="v${CLEAN_VER}.${{ github.run_number }}"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=TicketsCenter Release $TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            target/ticketscenter.war
            target/ticketscenter.war.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
