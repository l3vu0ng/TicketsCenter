<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketsCenter — Swagger API Explorer</title>
    <meta name="description" content="Tài liệu và giao diện tương tác thử nghiệm API cho TicketsCenter">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        :root {
            --tc-bg: #ffffff;
            --tc-surface: #f8fafc;
            --tc-border: #e2e8f0;
            --tc-primary: #4f46e5;
            --tc-accent: #0284c7;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--tc-bg);
            color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 2rem;
            background: #ffffff;
            border-bottom: 1px solid var(--tc-border);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: #0f172a;
        }
        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--tc-primary), var(--tc-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .csrf-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
        .csrf-badge.loading {
            background: #fefce8;
            color: #ca8a04;
            border-color: #fde047;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .btn-action:hover {
            background: #f8fafc;
            color: var(--tc-primary);
            border-color: var(--tc-primary);
        }
        .swagger-ui {
            font-family: inherit;
        }
        .swagger-ui .topbar { display: none; }
        .swagger-ui .info { margin: 2rem 0; }
        .swagger-ui .info .title { color: #0f172a; }
        .swagger-ui .scheme-container {
            background: #f8fafc;
            box-shadow: none;
            border-bottom: 1px solid var(--tc-border);
            padding: 1rem 0;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <a href="../" class="brand-container">
            <span class="brand-name">TicketsCenter</span>
            <span style="font-size: 0.85rem; color: #64748b; font-weight: 500;">API Explorer</span>
        </a>
        <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
            <div id="csrf-status" class="csrf-badge loading">
                <span>CSRF: Đang tải...</span>
            </div>
            <button id="btn-refresh-csrf" class="btn-action" title="Làm mới CSRF Token">
                <span>Làm mới CSRF</span>
            </button>
            <a href="openapi.json" target="_blank" class="btn-action">
                <span>JSON Spec</span>
            </a>
            <a href="../" class="btn-action">
                <span>Trang chủ &rarr;</span>
            </a>
        </div>
    </header>

    <main id="swagger-ui"></main>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        let currentCsrfToken = null;

        async function fetchCsrfToken() {
            const statusEl = document.getElementById('csrf-status');
            statusEl.className = 'csrf-badge loading';
            statusEl.innerHTML = '<span>CSRF: Đang lấy...</span>';
            try {
                const response = await fetch('../api/auth/csrf', { credentials: 'include' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                currentCsrfToken = data?.data?.token || data?.token;
                if (currentCsrfToken) {
                    statusEl.className = 'csrf-badge';
                    statusEl.innerHTML = '<span>CSRF: Sẵn sàng (' + currentCsrfToken.substring(0, 8) + '...)</span>';
                    return currentCsrfToken;
                }
                throw new Error('Token không tồn tại');
            } catch (err) {
                statusEl.className = 'csrf-badge loading';
                statusEl.innerHTML = '<span>CSRF: Thất bại</span>';
                console.error('Không thể lấy CSRF token:', err);
                return null;
            }
        }

        document.getElementById('btn-refresh-csrf').addEventListener('click', () => {
            fetchCsrfToken();
        });

        window.onload = async () => {
            await fetchCsrfToken();

            const ui = SwaggerUIBundle({
                url: "openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout",
                persistAuthorization: true,
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                requestInterceptor: async (req) => {
                    req.credentials = 'include';
                    const method = (req.method || 'GET').toUpperCase();
                    if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {
                        if (!currentCsrfToken) {
                            await fetchCsrfToken();
                        }
                        if (currentCsrfToken) {
                            req.headers['X-CSRF-Token'] = currentCsrfToken;
                        }
                    }
                    return req;
                },
                responseInterceptor: (res) => {
                    if (res.status === 403) {
                        currentCsrfToken = null;
                        fetchCsrfToken();
                    }
                    return res;
                }
            });

            window.ui = ui;
        };
    </script>
</body>
</html>
